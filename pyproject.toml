[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "silicon-archeology"
version = "0.1.0"
description = "SMT-Driven Binary-to-Compilable-Rust Re-Synthesis Engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
authors = [
    { name = "Silicon Archeology Authors" }
]
keywords = [
    "reverse-engineering",
    "decompilation",
    "rust",
    "formal-verification",
    "smt",
    "z3",
    "binary-analysis"
]
dependencies = [
    "z3-solver>=4.12.0",
    "capstone>=5.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[project.scripts]
silicon-archeology = "silicon_archeology.cli:main"
silicon = "silicon_archeology.cli:main"

[tool.setuptools.packages.find]
include = ["silicon_archeology*"]

